manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: dhruvinsh
      url-base: https://github.com/dhruvinsh
    - name: juniorz
      url-base: https://github.com/juniorz
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: main
    - name: zmk-tri-state
      remote: dhruvinsh
      revision: main
      path: modules/zmk-tri-state
    # Cirque Pinnacle (GlidePoint) trackpad driver. Disabled in firmware until
    # the trackpad is installed; the west module is only pulled for build-time
    # availability of the cirque,pinnacle binding/driver.
    - name: zmk-keyboard-cirque-pinnacle
      remote: juniorz
      revision: main
      path: modules/zmk-cirque-pinnacle
  self:
    path: config
