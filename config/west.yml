manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: dhruvinsh
      url-base: https://github.com/dhruvinsh
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
    - name: breakit
      url-base: https://github.com/breakit
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: main
    - name: zmk-tri-state
      remote: dhruvinsh
      revision: main
      path: modules/zmk-tri-state
    - name: zmk-nice-oled
      remote: breakit
      revision: "4.0"
      path: modules/zmk-nice-oled
    - name: zmk-oled-adapter
      remote: mctechnology17
      revision: main
      path: modules/zmk-oled-adapter
  self:
    path: config
