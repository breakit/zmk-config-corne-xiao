# Right (peripheral) half with zmk-nice-oled (LVGL 9).
#
# The peripheral screen uses nice!oled's default peripheral widgets (own
# battery). No central-only battery options apply here.

# nice!oled provides the custom status screen on the peripheral half too.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# --- Peripheral screen memory -----------------------------------------
# The peripheral screen also needs a dedicated display work queue and a larger
# heap/stack to boot reliably (nice!oled recommends 4096 heap / 2560 stack on
# the peripheral side).
CONFIG_LV_Z_MEM_POOL_SIZE=4096
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=2560
