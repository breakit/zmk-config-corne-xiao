# Right (peripheral) half with zmk-nice-oled (LVGL 9).
#
# The peripheral screen uses nice!oled's default peripheral widgets (own
# battery). No central-only battery options apply here.

# nice!oled provides the custom status screen on the peripheral half too.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Peripheral animation: samurai instead of the default cat.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SAMURAI=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n

# --- Peripheral screen memory -----------------------------------------
# The peripheral screen also needs a larger LVGL heap and a dedicated display
# work queue with a bigger stack to boot reliably. Use the same proven values
# as the central (left) side, since the 4096/2560 nice!oled recommendation can
# still leave the peripheral screen hanging on boot.
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
