# Use NFC pads as GPIOS
CONFIG_NFCT_PINS_AS_GPIOS=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Enable the display subsystem. This is the master switch that starts LVGL,
# the status screen, and the SSD1306 driver; without it the OLED stays blank.
CONFIG_ZMK_DISPLAY=y

# Use the custom (single-label test) status screen on the central (left) half.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n

# --- Memory/stack hypothesis tuning ---------------------------------------
# The custom screen currently runs with the LVGL heap at the 2048-byte Zephyr
# default (ZMK only bumps it to 4096 for the BUILT_IN screen). Raising it to
# 8192 mirrors nice_view's working custom screen, and using the dedicated
# display work queue with a larger stack avoids exhausting it at boot.
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# Full consumer HID usages, used by the "Buttons" layer shortcuts (Launchpad,
# Mission Control, Spotlight). Note: full usages have minor compatibility
# issues with some host OSes, same as Townk's original Corne configuration.
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y
