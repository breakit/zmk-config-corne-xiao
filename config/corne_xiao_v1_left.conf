# Left (central) half with zmk-nice-oled (LVGL 9).
#
# Show both the central (this half) and the one peripheral (right) battery on
# the central screen, and fetch the peripheral battery level over BLE so it can
# be rendered here.

# Use the nice!oled custom status screen (the module provides it).
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# nice!oled: central screen shows the central battery + the right (peripheral)
# battery.
CONFIG_NICE_OLED_WIDGET_CENTRAL_SHOW_BATTERY_PERIPHERAL_AND_CENTRAL=y

# Fetch the peripheral (right) battery level over BLE for the central screen.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Both-battery readout position. The MODO 3 battery text in the fork honors
# this X/Y; Y must be in the visible band (>=32) of the rotated canvas. Tune
# Y to sit between the connection info and the bongo cat.
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=38

# --- Label memory fix --------------------------------------------------
# The custom OLED screen needs a larger LVGL heap and a dedicated display work
# queue with a bigger stack or the screen hangs at boot. The nice!oled module
# also defaults to these for the central role; set them explicitly.
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
