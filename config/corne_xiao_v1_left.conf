# Left (central) half: uses the custom two-battery OLED status screen.
#
# This file is self-contained for the corne_xiao_v1_left build (ZMK does not
# merge the generic config/corne_xiao_v1.conf when a per-half conf exists).

# Use NFC pads as GPIOS
CONFIG_NFCT_PINS_AS_GPIOS=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Enable the display subsystem. This is the master switch that starts LVGL,
# the status screen, and the SSD1306 driver; without it the OLED stays blank.
CONFIG_ZMK_DISPLAY=y

# Custom (two-battery) status screen on the central (left) half.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n

# --- Label memory fix -----------------------------------------------
# The custom screen boot hung with the 2048-byte Zephyr LVGL heap default (ZMK
# only bumps it to 4096 for the BUILT_IN screen). Raising it to 8192 and using
# the dedicated display work queue with a larger stack keeps every label of the
# custom screen alive at boot.
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# Fetch the peripheral (right) battery level over BLE so the central screen can
# show both halves' charge as independent boxed icons.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Full consumer HID usages, used by the "Buttons" layer shortcuts (Launchpad,
# Mission Control, Spotlight). Note: full usages have minor compatibility
# issues with some host OSes, same as Townk's original Corne configuration.
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y
