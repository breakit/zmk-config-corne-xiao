# Use NFC pads as GPIOS
CONFIG_NFCT_PINS_AS_GPIOS=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y

# Console logging over USB (debug OLED/I2C bring-up)
CONFIG_ZMK_USB_LOGGING=y

# Use the built-in time/battery/layer/connection status screen
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
