# Use NFC pads as GPIOS
CONFIG_NFCT_PINS_AS_GPIOS=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y

# Console logging over USB (debug OLED/I2C bring-up)
CONFIG_ZMK_USB_LOGGING=y

# Debug logging for ZMK to trace OLED/I2C bring-up
CONFIG_ZMK_LOG_LEVEL_DBG=y

# Keep the display on so blank-on-idle can't hide a working panel during bring-up
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
