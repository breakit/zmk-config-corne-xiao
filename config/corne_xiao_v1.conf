# Use NFC pads as GPIOS
CONFIG_NFCT_PINS_AS_GPIOS=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Enable the display subsystem. This is the master switch that starts LVGL,
# the status screen, and the SSD1306 driver; without it the OLED stays blank.
CONFIG_ZMK_DISPLAY=y

# Fetch the battery level from the split peripheral (right half) on this,
# the central (left) half, so the display can show both batteries.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Expose the peripheral battery level through an additional BAS service.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Custom status screen (see boards/shields/corne_xiao_v1/widgets/status_screen.c):
# shows both halves' battery, WPM + Bongo-Cat, and the active layer.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# LVGL label + canvas support, needed by the custom status screen.
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_CANVAS=y
# Words-per-minute tracking for the status screen.
CONFIG_ZMK_WPM=y
# HID indicators (Caps/Scroll/Num Lock state) for the status screen.
CONFIG_ZMK_HID_INDICATORS=y

# Basic consumer HID usages. This covers the Media-layer volume/brightness and
# media-player keys with the broadest host compatibility. (Full usages caused
# compatibility issues on some Windows hosts where volume didn't apply, and the
# Buttons layer no longer needs the rare app-control usages.)
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# Pointing/mouse stack for the upcoming Cirque GlidePoint trackpad on the
# right half. Safe to keep enabled while no pointing device is active; the
# trackpad nodes are gated off by CONFIG_CORNE_XIAO_RIGHT_TRACKPAD (=n).
CONFIG_ZMK_POINTING=y
