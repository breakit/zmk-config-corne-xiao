# Use NFC pads as GPIOS
CONFIG_NFCT_PINS_AS_GPIOS=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y

# Console logging over USB (debug OLED/I2C bring-up)
CONFIG_ZMK_USB_LOGGING=y

# Debug logging for ZMK and the SSD1306/I2C drivers to trace OLED bring-up
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_SSD1306_LOG_LEVEL_DBG=y
CONFIG_NRF_TWIM_LOG_LEVEL_DBG=y
