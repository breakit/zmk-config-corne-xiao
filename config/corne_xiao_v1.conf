# Use NFC pads as GPIOS
CONFIG_NFCT_PINS_AS_GPIOS=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Full consumer HID usages, used by the "Buttons" layer shortcuts (Launchpad,
# Mission Control, Spotlight). Note: full usages have minor compatibility
# issues with some host OSes, same as Townk's original Corne configuration.
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y
