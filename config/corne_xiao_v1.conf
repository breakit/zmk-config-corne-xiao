# Use NFC pads as GPIOS
CONFIG_NFCT_PINS_AS_GPIOS=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y
# Keep the local keymap always active: do not gate it behind Studio's
# lock/unlock (otherwise the board boots LOCKED and layer switching +
# the physical keymap stay inert until an unlock combo is pressed).
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# Keep the display on so blank-on-idle can't hide a working panel during bring-up
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
