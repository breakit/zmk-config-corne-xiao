# Use NFC pads as GPIOS
CONFIG_NFCT_PINS_AS_GPIOS=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Enable the display subsystem. This is the master switch that starts LVGL,
# the status screen, and the SSD1306 driver; without it the OLED stays blank.
CONFIG_ZMK_DISPLAY=y

# Fetch the battery level from the split peripheral (right half) on this,
# the central (left) half, so the display can show both batteries.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Expose the peripheral battery level through an additional BAS service.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Custom two-battery status screen (see boards/shields/corne_xiao_v1/widgets).
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# LVGL label support, needed by the custom status screen (the built-in screen
# would otherwise imply it).
CONFIG_LV_USE_LABEL=y

# Full consumer HID usages, used by the "Buttons" layer shortcuts (Launchpad,
# Mission Control, Spotlight). Note: full usages have minor compatibility
# issues with some host OSes, same as Townk's original Corne configuration.
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y

# Pointing/mouse stack for the upcoming Cirque GlidePoint trackpad on the
# right half. Safe to keep enabled while no pointing device is active; the
# trackpad nodes are gated off by CONFIG_CORNE_XIAO_RIGHT_TRACKPAD (=n).
CONFIG_ZMK_POINTING=y
