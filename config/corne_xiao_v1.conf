# Use NFC pads as GPIOS
CONFIG_NFCT_PINS_AS_GPIOS=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Enable the display subsystem. This is the master switch that starts LVGL,
# the status screen, and the SSD1306 driver; without it the OLED stays blank.
CONFIG_ZMK_DISPLAY=y

# Keep the panel on during bring-up so blank-on-idle can't hide it.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Full consumer HID usages, used by the "Buttons" layer shortcuts (Launchpad,
# Mission Control, Spotlight). Note: full usages have minor compatibility
# issues with some host OSes, same as Townk's original Corne configuration.
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y

# Temporary debug logging to trace OLED/I2C bring-up. Remove once the display
# is confirmed working.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
